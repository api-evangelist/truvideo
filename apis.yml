aid: truvideo
name: TruVideo
description: >-
  TruVideo is a video-intelligence and omnichannel communication platform for
  service businesses, built for the automotive service market and expanding into
  aviation, insurance, and commercial trucking. It lets dealers, service
  advisors, and technicians capture and share videos, run AI features (noise
  cancellation, real-time sentiment analysis, and a multilingual virtual
  assistant), and drive SMS/messaging conversations tied to repair orders.
  TruVideo's developer surface is SDK-first — modular on-device capture SDKs for
  iOS, Android, .NET, React Native, and Capacitor — plus a REST Platform API
  (v2) covering authentication, repair orders, videos, messaging, customers,
  files, and reporting.
