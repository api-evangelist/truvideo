source: >-
  github.com/Truvideo organization repositories (55 public repos, enumerated via
  GitHub API 2026-07-21). TruVideo distributes its mobile capture SDKs primarily
  as source/native modules through GitHub (Swift Package Manager / CocoaPods for
  iOS, Gradle/Maven for Android, npm-packaged React Native + Capacitor plugins,
  NuGet-packaged .NET modules). None of the React Native / Capacitor packages
  were found published on the public npm registry as of 2026-07-21 — they are
  distributed via the GitHub repositories.
notes: >-
  TruVideo's public developer surface is SDK-first: a modular family of on-device
  video, camera, media, image and core modules for embedding TruVideo capture and
  communication into partner apps. Modules are grouped by platform and by
  capability (core / camera / video / media / image).
